  <head>

    <!-- Browser Tab Icon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iPadOS/iOS Home Screen Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />

    <title>Budee</title>
                    <style>
                      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
                      
                      /* 🟢 PROPORTIONAL MOBILE SCALING (Forces UI to scale like a vector on phones) */
                      @media (max-width: 767px) {
                        html {
                          /* Tweak this number (e.g., 3.8vw, 4.5vw) until the UI scale feels perfect! */
                          font-size: 4.2vw !important;
                        }
                      }
                
                      /* 🟢 SAFARI ASSASSIN: Completely freeze the background so the OS can't pull it */
                      html, body {
                        font-family: 'Inter', sans-serif;
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        overflow: hidden;
                        overscroll-behavior: none;
                        touch-action: none;
                      }
                
                      /* 🟢 Move all scrolling inside your React app instead */
                      #root {
                        width: 100%;
                        height: 100%;
                        overflow-y: auto;
                        overflow-x: hidden;
                        -webkit-overflow-scrolling: touch; /* Keeps the buttery smooth iOS momentum scrolling */
                      }
                      
                      .glass-effect {
                        background: rgba(255, 255, 255, 0.7);
                        backdrop-filter: blur(10px);
                        border: 1px solid rgba(255, 255, 255, 0.2);
                      }
                    </style> 
                
          
  <script type="importmap">
{
  "imports": {

<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-200">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // 🟢 TRACKPAD ASSASSIN: Kills the 2-finger horizontal swipe on Apple Trackpads
    document.addEventListener('wheel', function(e) {
      // If the user is scrolling horizontally more than vertically
      const isHorizontalScroll = Math.abs(e.deltaX) > Math.abs(e.deltaY);
      
      if (isHorizontalScroll) {
        e.preventDefault(); // Stop Safari from navigating back/forward!
      }
    }, { passive: false });
  </script>

</body>
